name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 账号 ID 不是机密；只需在仓库 Secret 里配置 CLOUDFLARE_API_TOKEN
  CLOUDFLARE_ACCOUNT_ID: c8887f012b943118493574f8268764e7
  # NEXT_PUBLIC_* 会在构建时被内联，必须在构建环境里给出（都是公开值）
  NEXT_PUBLIC_SUPABASE_URL: https://cgtprzxltdlibgqkfgbf.supabase.co
  NEXT_PUBLIC_SITE_URL: https://jinyoudata.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检查部署凭据
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未配置仓库 Secret CLOUDFLARE_API_TOKEN，本次跳过构建与部署。"
            echo "配置好后可在 Actions 页面点 Run workflow 重新触发。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm ci

      - name: Build for Pages (next-on-pages)
        if: steps.creds.outputs.ready == 'true'
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy .vercel/output/static --project-name=qipei-web --branch=main
